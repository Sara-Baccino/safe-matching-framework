[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safe-matching-framework"
dynamic = ["version"]
description = "Matching di popolazioni (propensity score, hungarian, sorted, partial optimal transport) con report PDF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pydantic>=2.5",
    "pot>=0.9.4",
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[project.optional-dependencies]
excel = ["fastexcel>=0.10", "openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
safe-matching = "safe_matching.cli:main"

[tool.hatch.version]
path = "safe_matching/version.py"

[tool.hatch.build.targets.wheel]
packages = ["safe_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]
